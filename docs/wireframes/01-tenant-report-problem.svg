  <text x="30" y="622" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">My baby has been wheezing at night</text>
  <text x="30" y="642" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">since the mould came back.</text>
  <text x="20" y="698" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Photos (optional)</text>
