  <text x="34" y="411" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Something else</text>
  <text x="20" y="462" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Which room?</text>
  <rect x="20" y="474" width="127.20000000000002" height="22" rx="11" fill="#24292f" stroke="#24292f" stroke-width="1"/>
  <text x="29" y="489" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Child&#x27;s bedroom</text>
  <rect x="155.20000000000002" y="474" width="76.24000000000001" height="22" rx="11" fill="#eaeef2" stroke="#eaeef2" stroke-width="1"/>
  <text x="164.20000000000002" y="489" font-size="13" font-weight="600" fill="#424a53" text-anchor="start">Bathroom</text>
