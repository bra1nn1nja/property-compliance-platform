  <rect x="20" y="152" width="350" height="62" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1"/>
  <text x="34" y="176" font-size="13" font-weight="700" fill="#a40e26" text-anchor="start">Immediate danger? Gas, electrics, flooding</text>
  <text x="34" y="198" font-size="13" font-weight="400" fill="#a40e26" text-anchor="start">Call our emergency repairs line now.</text>
  <text x="20" y="244" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">What&#x27;s the problem?</text>
  <rect x="20" y="256" width="170" height="52" rx="8" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="34" y="287" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Damp or mould</text>
  <rect x="200" y="256" width="170" height="52" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="214" y="287" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Leak or water</text>
  <rect x="20" y="318" width="170" height="52" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="34" y="349" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Heating</text>
