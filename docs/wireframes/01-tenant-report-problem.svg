  <text x="135.08" y="519" font-size="13" font-weight="600" fill="#424a53" text-anchor="start">Other</text>
  <text x="20" y="558" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Is anyone&#x27;s health affected?</text>
